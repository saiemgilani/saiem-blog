name: images
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: saiem_app
          POSTGRES_PASSWORD: saiem_test
          POSTGRES_DB: saiem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saiem_app -d saiem" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://saiem_app:saiem_test@localhost:5432/saiem
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose.yml build
      - run: docker compose -f deploy/compose.yml up -d
      - name: Wait for api + web
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8100/health && curl -fsS -o /dev/null http://127.0.0.1:3100/ && curl -fsS -o /dev/null http://127.0.0.1:3100/notes/intro-to-hoopR && curl -fsS -o /dev/null http://127.0.0.1:3100/sw.js; then exit 0; fi
            sleep 3
          done
          docker compose -f deploy/compose.yml logs
          exit 1
      - if: always()
        run: docker compose -f deploy/compose.yml down -v
  publish:
    if: github.event_name == 'push'
    needs: [api-tests, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (sha and latest)
        run: |
          for TAG in "${GITHUB_SHA::7}" latest; do
            TAG="$TAG" docker compose -f deploy/compose.yml build
            TAG="$TAG" docker compose -f deploy/compose.yml push
          done
