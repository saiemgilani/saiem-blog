name: guards
# No paths filter: a required check whose workflow is skipped stays "expected" forever.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dead-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-dead-domains.test.mjs
      - run: node scripts/check-dead-domains.mjs
