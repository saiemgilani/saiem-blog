[project]
name = "saiem-api"
version = "0.1.0"
description = "Backend for saiemgilani.com (views, projects, quotas, lab runs)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
saiem-api = "saiem_api.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saiem_api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "fastapi.Body", "saiem_api.auth.require"]
