# deploy/compose.yml — `docker compose -f deploy/compose.yml …`
# Images come from GHCR on the droplet (`pull`); CI and dev `build` from source.
# HARDENING: every published port binds 127.0.0.1 (Docker bypasses ufw); only Caddy
# on the host listens publicly. Enforced by api/tests/test_compose_ports.py.
name: saiem
services:
  api:
    image: ghcr.io/saiemgilani/saiem-blog-api:${TAG:-latest}
    build:
      context: ../api
      dockerfile: ../deploy/Dockerfile.api
    # Values come from deploy/.env on the droplet (chmod 600, never committed — see .env.example);
    # compose.dev.yml overrides them for dev/CI.
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SAIEM_API_SECRET: ${SAIEM_API_SECRET:-}
      OWNER_GITHUB_ID: ${OWNER_GITHUB_ID:-}
    volumes:
      # Production database access = the HOST's Postgres unix socket (spec §3): no TCP listener
      # is added for this app. Read-only is enough — connecting to a socket needs no write
      # permission on the mount. Dev/CI point DATABASE_URL at the `db` container instead and
      # never use this mount (Docker just creates an empty host dir).
      - ${PG_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql:ro
    command: ["sh", "-c", "/app/.venv/bin/saiem-api migrate && exec /app/.venv/bin/saiem-api serve --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
  web:
    image: ghcr.io/saiemgilani/saiem-blog-web:${TAG:-latest}
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.web
    environment:
      API_BASE_URL: http://api:8000
      SAIEM_API_SECRET: ${SAIEM_API_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_TRUST_HOST: "true"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - web-cache:/app/.next/cache
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  web-cache: {}
